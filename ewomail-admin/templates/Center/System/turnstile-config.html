{include file='header.html'}
<div class="panel">
  <div class="panel-head"><strong>Cloudflare Turnstile 设置</strong></div>
  <div class="panel-body">
    <form id="turnstileForm">
      <div class="form-group"><label>启用</label>
        <select name="turnstile_enabled" class="input">
          <option value="0" {if $data.turnstile_enabled!='1'}selected{/if}>关闭</option>
          <option value="1" {if $data.turnstile_enabled=='1'}selected{/if}>开启</option>
        </select>
      </div>
      <div class="form-group"><label>Site Key</label><input class="input" name="turnstile_site_key" value="{$data.turnstile_site_key|escape}"/></div>
      <div class="form-group"><label>Secret Key</label><input class="input" name="turnstile_secret_key" value="{$data.turnstile_secret_key|escape}"/></div>
      <button type="button" class="button bg-main" onclick="saveTurnstile()">保存</button>
    </form>
  </div>
</div>
<script>
function saveTurnstile(){
  $.ajax({url:"{:U('/System/turnstile-config')}", type:'PUT', data:$('#turnstileForm').serialize(), success:function(d){alert(d.msg||'已保存'); location.reload();}})
}
</script>
{include file='footer.html'}
