[ewomail]
user  = www-data
group = www-data

listen = @@EWO_PHP_SOCK@@
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 16
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

php_admin_value[memory_limit]        = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M
php_admin_flag[expose_php]           = off
php_admin_value[date.timezone]       = UTC

; 原 EwoMail 代码是 2016 写的，PHP 8.2 跑起来会刷一堆「strftime is
; deprecated」「Implicit conversion from float to int」之类的
; deprecation/notice 警告。这些不影响功能但污染 PHP-FPM stderr，
; 进而被 nginx 当作 fastcgi 响应头一部分缓冲，太多就触发
; "upstream sent too big header" → 500。
; 关掉 deprecation/notice，但保留 warning/error 用于真正的故障排查。
; 注意：php-fpm 的 pool config 解析器不识别 E_ALL/E_DEPRECATED 这种常量
; 表达式，必须用裸数字。5111 = E_ALL & ~(E_NOTICE | E_USER_NOTICE |
; E_DEPRECATED | E_USER_DEPRECATED | E_STRICT)
;   = 1+2+4+16+32+64+128+256+512+4096
php_admin_value[error_reporting]     = 5111
php_admin_value[log_errors_max_len]  = 4096
php_admin_flag[display_errors]       = off

; Session save path is overridden per location in nginx vhost (PHP_VALUE).
