# Shared FastCGI for our PHP applications. Each consumer sets:
#   set $ewo_app_root <docroot>;
#   set $ewo_session_path /ewomail/www/session/<app>;
location ~ \.php(?:/.*)?$ {
    fastcgi_pass   unix:@@EWO_PHP_SOCK@@;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_index  index.php;
    include        /etc/nginx/fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $fastcgi_path_info;
    fastcgi_param  PHP_VALUE        "open_basedir=/ewomail/www/:/tmp/:/proc/\nsession.save_path=$ewo_session_path";
    fastcgi_read_timeout 300;
    # 默认 fastcgi_buffer_size 是 4K——PHP 响应里的 Set-Cookie + CSRF token
    # + 我们新加的 admin/security headers 总和超过会触发
    # "upstream sent too big header" -> 500。给到 32K 足够留余量。
    fastcgi_buffer_size       32k;
    fastcgi_buffers           8 32k;
    fastcgi_busy_buffers_size 64k;
}
