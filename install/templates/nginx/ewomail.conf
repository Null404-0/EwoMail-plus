# EwoMail-plus public vhost. Single domain hosts everything via random paths.

server {
    listen 80;
    listen [::]:80;
    server_name @@EWO_MAIL_HOST@@;

    # ACME HTTP-01 challenge for acme.sh (webroot mode).
    location ^~ /.well-known/acme-challenge/ {
        root /ewomail/www/default;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 关于 http2 写法：
    # - nginx 1.22 (Debian 自带)：必须用 `listen ... http2`
    # - nginx 1.25.1+ / 1.30：推荐独立指令 `http2 on;`，老写法被标 deprecated
    #   但仍能 parse、仅产生一行 warning
    # 这里保留老写法做最大兼容：fresh 装是 nginx.org 1.30+（推荐），但同一份
    # 模板也允许 1.22（EWO_ALLOW_NGINX_OLD=1）或现存 1.22 用户跑 update.sh 后
    # 仍能 nginx -t 通过。1.30 上的 deprecation warning 无害可忽略。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@EWO_MAIL_HOST@@;

    include /etc/nginx/snippets/ewomail-ssl.conf;
    include /etc/nginx/snippets/ewomail-security.conf;

    # ---- Webmail (SnappyMail) at /  ----
    root /ewomail/www/snappymail;
    index index.php;

    set $ewo_session_path /ewomail/www/session/webmail;

    # The /data tree contains SnappyMail's storage (configs, address books,
    # per-user data) and must never be served over HTTP.
    location ^~ /data { deny all; return 403; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    include /etc/nginx/snippets/ewomail-php.conf;

    # ---- Admin panel at /<EWO_ADMIN_PATH>/ ----
    location ^~ /@@EWO_ADMIN_PATH@@/ {
        alias /ewomail/www/ewomail-admin/;
        index index.php;
        set $ewo_session_path /ewomail/www/session/ewomail-admin;
        set $ewo_app_root /ewomail/www/ewomail-admin;

        try_files $uri $uri/ @ewomail_admin;

        location ~ \.php(?:/.*)?$ {
            alias /ewomail/www/ewomail-admin/;
            fastcgi_pass   unix:@@EWO_PHP_SOCK@@;
            fastcgi_split_path_info ^/@@EWO_ADMIN_PATH@@(/.+\.php)(/.+)?$;
            fastcgi_index  index.php;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  /ewomail/www/ewomail-admin$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT    /ewomail/www/ewomail-admin;
            fastcgi_param  PATH_INFO        $fastcgi_path_info;
            fastcgi_param  PHP_VALUE        "open_basedir=/ewomail/www/:/tmp/:/proc/\nsession.save_path=/ewomail/www/session/ewomail-admin";
            fastcgi_read_timeout 300;
            fastcgi_buffer_size       32k;
            fastcgi_buffers           8 32k;
            fastcgi_busy_buffers_size 64k;
        }
    }
    location @ewomail_admin {
        rewrite ^/@@EWO_ADMIN_PATH@@/(.*)$ /@@EWO_ADMIN_PATH@@/index.php/$1 last;
    }

    # ---- Adminer at /<EWO_DB_PATH>/ ----
    location ^~ /@@EWO_DB_PATH@@/ {
        ## EWOMAIL_DB_ENABLED ##
        alias /ewomail/www/adminer/;
        index index.php;
        set $ewo_session_path /ewomail/www/session/adminer;
        try_files $uri /@@EWO_DB_PATH@@/index.php?$args;

        location ~ \.php$ {
            alias /ewomail/www/adminer/;
            fastcgi_pass   unix:@@EWO_PHP_SOCK@@;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  /ewomail/www/adminer$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT    /ewomail/www/adminer;
            fastcgi_param  PHP_VALUE        "open_basedir=/ewomail/www/:/tmp/:/proc/\nsession.save_path=/ewomail/www/session/adminer";
            fastcgi_buffer_size       32k;
            fastcgi_buffers           8 32k;
            fastcgi_busy_buffers_size 64k;
        }
    }
}
